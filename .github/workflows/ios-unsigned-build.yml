name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Build KMP Apple Framework for iOS
        run: |
          ./gradlew :composeApp:assembleComposeAppReleaseXCFramework

      - name: Archive iOS Application (Without Signing)
        run: |
          xcodebuild clean archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/osintapp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned .ipa Artifact
        run: |
          mkdir -p iosApp/build/Payload
          cp -r iosApp/build/osintapp.xcarchive/Products/Applications/*.app iosApp/build/Payload/
          cd iosApp/build
          zip -r -9 osintapp-unsigned.ipa Payload
          ls -lh osintapp-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osintapp-unsigned-ipa
          path: iosApp/build/osintapp-unsigned.ipa
          retention-days: 14
